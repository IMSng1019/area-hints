# ===== 第三档：实验性 26.1 / 26.2（暂不落地配置，先把形态记下来）=====
# 这两个版本没有 Yarn 也没有 intermediary（Maven 目录 404），需要：
#   1) 换成不重映射的 Loom 插件 net.fabricmc.fabric-loom（≤1.21.11 用 fabric-loom-remap）；
#   2) Java 25 工具链（本机 Gradle 已缓存 eclipse_adoptium-25）；
#   3) loader 必须 >= 0.18.4（其 Fabric API 的硬要求），调研给出 0.19.5；
#   4) build.gradle 里 mappings 一行不能再读 deps.<v>.yarn，要走官方映射或干脆不重映射。
# 另外 VulkanMod 在 1.21.8 与 26.2 无 Fabric 坐标；当前源码全反射用它，不需要编译期依赖。
# deps.26.1.minecraft=26.1
# deps.26.1.loader=0.19.5
# deps.26.1.fabric=0.155.3+26.1.2
# deps.26.1.java=25
# deps.26.2.minecraft=26.2
# deps.26.2.loader=0.19.5
# deps.26.2.fabric=0.161.0+26.2
