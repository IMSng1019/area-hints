pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

// Stonecutter：负责多版本编排（版本号写死，settings 脚本里读不到 gradle.properties 的属性）
plugins {
	id 'dev.kikugie.stonecutter' version '0.9.7'
}

stonecutter {
	// 本仓库用 Groovy DSL，需要显式关闭默认的 Kotlin 控制器
	kotlinController = false
	// 共享构建脚本沿用现有的 build.gradle，它会被应用到每个版本节点
	centralScript = 'build.gradle'

	// 活跃版本列表：只放「当前能编译通过」的版本，保证默认 gradlew build 始终是绿的。
	// 完整清单、依赖坐标与三档划分见 docs/plans/multiversion/11-版本矩阵.md：
	//   第一档 必出包：1.20.4（常驻基线，完整代码）、1.20.1（阶段 4 打开）、1.21.1（暂为骨架）
	//   第二档 仅声明：1.20.6 / 1.21.4 / 1.21.5 / 1.21.8 / 1.21.11（依赖已齐，等阶段 3 网络层与阶段 4 渲染层）
	//   第三档 实验性：26.1 / 26.2（无 Yarn、无 intermediary，需要 no-remap Loom 与 JDK 25）
	// 各版本的构建参数已经全部写进 gradle.properties，激活某个版本只需把它加进下面的 versions 列表
	create(getRootProject()) {
		versions '1.20.4', '1.20.1', '1.21.1'
		// 1.20.1 已完成「第二真实编译目标」验证（src/main 0 错误、src/client 16 处 UI API 差异），
		// 要复现就把下面这行放回 versions 列表，详见 17-第二真实编译目标验证.md
		// version '1.20.1', '1.20.1'
		// 1.20.6 在当前代码形态下无法编译（src/main 61 条网络层错误），等阶段 3 的 NetworkCompat
		// version '1.20.6', '1.20.6'
		// 1.21.4 / 1.21.5 / 1.21.8 / 1.21.11 依赖齐全，但要先过渲染层适配（阶段 4）
		// version '1.21.4', '1.21.4'
		// version '1.21.5', '1.21.5'
		// version '1.21.8', '1.21.8'
		// version '1.21.11', '1.21.11'
		// 26.1 / 26.2 需要另建 buildscript（无映射、no-remap Loom、JDK 25），不要直接加进来
	}
}
