pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

// Stonecutter：负责多版本编排（版本号写死，settings 脚本里读不到 gradle.properties 的属性）
plugins {
	id 'dev.kikugie.stonecutter' version '0.9.7'
}

stonecutter {
	// 本仓库用 Groovy DSL，需要显式关闭默认的 Kotlin 控制器
	kotlinController = false
	// 共享构建脚本沿用现有的 build.gradle，它会被应用到每个版本节点
	centralScript = 'build.gradle'

	// 活跃版本均构建完整模组；1.20.4 保持为共享源码的开发基线。
	// 26.x 使用独立官方命名源码分支，保留旧版共享源码和构建入口。
	create(getRootProject()) {
		versions '1.20.4', '1.20.1', '1.20.6', '1.21.1', '1.21.4', '1.21.5', '1.21.8', '1.21.10', '1.21.11'
		branch('modern') {
			versions('26.1.2').buildscript('../build-modern.gradle')
		}
	}
}
