# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.20.4
yarn_mappings=1.20.4+build.3
loader_version=0.16.14
loom_version=1.10-SNAPSHOT

# Mod Properties
mod_version=4.6.0
maven_group=areahint
archives_base_name=areas-hint
# 构建产物文件名中的平台标识（Fabric 填 fabric，Forge 填 forge，NeoForge 填 neoforge）
mod_loader=fabric

# Dependencies
fabric_version=0.97.2+1.20.4
modmenu_version=9.2.0
xaero_minimap_version=25.2.0_Fabric_1.20.4
xaero_world_map_version=1.39.2_Fabric_1.20.4

# ===== Stonecutter 多版本编排 =====
# 仅供记录：settings.gradle 的 plugins{} 里读不到这里的属性，插件版本在 settings.gradle 内写死
stonecutter_version=0.9.7

# 每个目标版本一份依赖坐标，命名规则 deps.<mcVersion>.<name>
# name 取值：minecraft / yarn / loader / fabric / java / skeleton
# skeleton=true 表示该版本只构建空骨架 jar，不参与共享 src/ 的模组代码编译

# --- 1.20.4：保持完整模组代码，与改造前等价 ---
deps.1.20.4.minecraft=1.20.4
deps.1.20.4.yarn=1.20.4+build.3
deps.1.20.4.loader=0.16.14
deps.1.20.4.fabric=0.97.2+1.20.4
deps.1.20.4.java=17
deps.1.20.4.skeleton=false

# --- 1.21.1：探针阶段只出空骨架 jar（新版网络/渲染 API 与现有代码不兼容） ---
deps.1.21.1.minecraft=1.21.1
deps.1.21.1.yarn=1.21.1+build.3
deps.1.21.1.loader=0.16.14
deps.1.21.1.fabric=0.116.0+1.21.1
deps.1.21.1.java=21
deps.1.21.1.skeleton=true

# --- 1.20.1：第二真实编译目标探针（同代际 / Yarn / Java 17） ---
# 验证后已从 settings.gradle 活跃列表移出，保留本组坐标便于一键复现
# 补充：yarn 1.20.1 的最新 build 是 1.20.1+build.10，fabric-api 最新是 0.92.12+1.20.1
# 复现方式：把 '1.20.1' 放回 settings.gradle 的 versions 列表，再跑 .\gradlew.bat :1.20.1:build
deps.1.20.1.minecraft=1.20.1
deps.1.20.1.yarn=1.20.1+build.1
deps.1.20.1.loader=0.16.14
deps.1.20.1.fabric=0.92.6+1.20.1
deps.1.20.1.java=17
deps.1.20.1.skeleton=false

# --- 1.20.6：探针 C 用来量化 1.20.4 -> 1.20.6 的真实编译断点 ---
deps.1.20.6.minecraft=1.20.6
deps.1.20.6.yarn=1.20.6+build.1
deps.1.20.6.loader=0.16.14
deps.1.20.6.fabric=0.100.8+1.20.6
deps.1.20.6.java=21
deps.1.20.6.skeleton=false
