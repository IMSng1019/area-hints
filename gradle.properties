# Done to increase the memory available to gradle.
# 四个真实构建目标并行 remap 时 1G 会 OOM，提到 3G
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.20.4
yarn_mappings=1.20.4+build.3
loader_version=0.16.14
loom_version=1.10-SNAPSHOT

# Mod Properties
mod_version=4.6.0
maven_group=areahint
archives_base_name=areas-hint
# 构建产物文件名中的平台标识（Fabric 填 fabric，Forge 填 forge，NeoForge 填 neoforge）
mod_loader=fabric

# Dependencies（以下扁平键是 1.20.4 单版本时代的写法：保留不删，但第三方依赖已不再读取它们）
fabric_version=0.97.2+1.20.4
modmenu_version=9.2.0
xaero_minimap_version=25.2.0_Fabric_1.20.4
xaero_world_map_version=1.39.2_Fabric_1.20.4

# ===== Stonecutter 多版本编排 =====
# 仅供记录：settings.gradle 的 plugins{} 里读不到这里的属性，插件版本在 settings.gradle 内写死
stonecutter_version=0.9.7

# 每个目标版本一份依赖坐标，命名规则 deps.<mcVersion>.<name>
# 官方参数 name：minecraft / yarn / loader / fabric / java / skeleton
#   skeleton=true 表示该版本只构建空骨架 jar，不参与共享 src/ 的模组代码编译
# 第三方依赖 name：modmenu / xaero_minimap / xaero_world_map / bluemap / luckperms
#   modmenu 与 xaero_* 填 Modrinth 的版本号（形如 9.2.0 / 25.2.0_Fabric_1.20.4）
#   bluemap 与 luckperms 填【完整坐标 group:artifact:version】：BlueMap 在 2.7.3 起换了 group:artifact，
#   只换版本号会取不到；两者字节码版本也不同，必须与节点 Java 对齐
# 坐标依据与三档划分见 docs/plans/multiversion/11-版本矩阵.md

# ===== 第一档：必出包 =====

