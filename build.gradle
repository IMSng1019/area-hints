plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

// ===== Stonecutter 多版本解析 =====
// Stonecutter 的共享构建脚本会对每个版本节点各执行一次：
// - 版本节点子项目的名字就是目标 MC 版本（versions/1.20.4 -> 1.20.4）
// - 根项目（tree）取 Stonecutter 的活跃版本
// 两种都取不到时回退到旧的扁平属性，保证原有单版本构建方式依旧可用。
def resolveMcVersion = {
	def fromStonecutter = null
	def stonecutterExt = project.extensions.findByName('stonecutter')
	if (stonecutterExt != null) {
		try {
			def current = stonecutterExt.current
			if (current != null) {
				fromStonecutter = current.version.toString()
			}
		} catch (Exception ignored) {
			// 非 Stonecutter 环境：忽略，走下面的回退分支
		}
	}
	if (fromStonecutter != null) {
		return fromStonecutter
	}
	if (project.parent != null) {
		return project.name
	}
	return project.findProperty('minecraft_version').toString()
}
def mcVersion = resolveMcVersion()

// 每版本参数优先读 deps.<mcVersion>.<name>，缺失时回退到旧的扁平键，避免本阶段破坏原构建
def versionedProp = { String name, String legacyKey ->
	def value = project.findProperty("deps.${mcVersion}.${name}")
	if (value == null) {
		value = project.findProperty(legacyKey)
	}
	if (value == null) {
		throw new GradleException("缺少依赖参数：${legacyKey} 或 deps.${mcVersion}.${name}")
	}
	return value.toString()
}
def mcVersionDep = versionedProp('minecraft', 'minecraft_version')
def yarnDep = versionedProp('yarn', 'yarn_mappings')
def loaderDep = versionedProp('loader', 'loader_version')
def fabricDep = versionedProp('fabric', 'fabric_version')
def javaDep = (project.findProperty("deps.${mcVersion}.java") ?: '17').toString()
// 骨架版本：只出一个最小的空壳 jar，不编译共享 src/ 里的模组代码
def skeletonOnly = (project.findProperty("deps.${mcVersion}.skeleton") ?: 'false').toString().toBoolean()

// 第三方依赖按版本解析（D2）：只读 deps.<mcVersion>.<name>，刻意不回退旧的扁平键。
// 原因（实测）：扁平键属于 1.20.4，被别的版本沿用会「编译能过、运行时加载失败」。
// 该版本查不到坐标时不要写这个键，构建脚本会跳过声明，缺失原因记录在 11-版本矩阵.md。
def thirdPartyProp = { String name ->
	def value = project.findProperty("deps.${mcVersion}.${name}")
	return value == null ? null : value.toString()
}
// 统一的「有坐标就声明、没坐标就打印一行」逻辑，避免每个依赖各写一遍
def declareThirdParty = { String name, String displayName, Closure declare ->
	def value = thirdPartyProp(name)
	if (value != null) {
		declare(value)
	} else {
		logger.lifecycle("[areas-hint] ${mcVersion} 未声明 ${displayName}：该版本无可用坐标（见 11-版本矩阵.md）")
	}
}

version = project.mod_version
group = project.maven_group

// 模组平台标识：默认 Fabric，移植到 Forge/NeoForge 时在 gradle.properties 里改 mod_loader
def modLoader = (project.findProperty("mod_loader") ?: "fabric").toString().trim().toLowerCase(Locale.ROOT)
// 产物基础名：模组名-平台-MC版本，Gradle 会再拼上 mod_version，最终形如 areas-hint-fabric-1.20.4-4.6.0.jar
def artifactBaseName = "${project.archives_base_name}-${modLoader}-${mcVersionDep}"

base {
	archivesName = artifactBaseName
}

repositories {
	mavenCentral()
	maven { url 'https://repo.bluecolored.de/releases' }
	maven { url 'https://maven.terraformersmc.com/' }
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content {
			includeGroup 'maven.modrinth'
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"areas-hint" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

if (skeletonOnly) {
	// 骨架版本：把两个环境 source set 整体指向 versions/<mcVersion>/skeleton 下的最小骨架，
	// 这样就剔除了 Stonecutter 从根 src/ 链接进来的模组代码，只产出一个可辨认的空壳 jar
	sourceSets.main.java.setSrcDirs([file('skeleton/main/java')])
	sourceSets.main.resources.setSrcDirs([file('skeleton/main/resources')])
	sourceSets.client.java.setSrcDirs([file('skeleton/client/java')])
	sourceSets.client.resources.setSrcDirs([file('skeleton/client/resources')])
}

if (!skeletonOnly) {
	fabricApi {
		configureDataGeneration {
			client = true
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${mcVersionDep}"
	mappings "net.fabricmc:yarn:${yarnDep}:v2"
	modImplementation "net.fabricmc:fabric-loader:${loaderDep}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricDep}"

	if (!skeletonOnly) {
		// 以下第三方依赖全部按当前节点版本解析（D2），该版本缺坐标就不声明该依赖
		declareThirdParty('modmenu', 'ModMenu') { v -> modCompileOnly "maven.modrinth:modmenu:${v}" }
		declareThirdParty('luckperms', 'LuckPerms') { v -> compileOnly "net.luckperms:api:${v}" }
		declareThirdParty('bluemap', 'BlueMap') { v -> compileOnly "de.bluecolored.bluemap:BlueMapAPI:${v}" }

		// Xaero 兼容代码使用远程精确版本编译，避免 CI 依赖被 Git 忽略的本地 JAR。
		declareThirdParty('xaero_minimap', 'Xaero 小地图') { v ->
			modCompileOnly "maven.modrinth:xaeros-minimap:${v}"
			// 本地运行时加载相同版本用于联调，modLocalRuntime 不会将 Xaero 打进最终模组。
			modLocalRuntime "maven.modrinth:xaeros-minimap:${v}"
		}
		declareThirdParty('xaero_world_map', 'Xaero 世界地图') { v ->
			modCompileOnly "maven.modrinth:xaeros-world-map:${v}"
			modLocalRuntime "maven.modrinth:xaeros-world-map:${v}"
		}
	}

	testImplementation platform("org.junit:junit-bom:5.12.2")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"

}

// ===== 产物元数据按版本解析（阶段 1 Task 3）=====
// minecraft 依赖范围默认收紧到当前节点版本；如需放宽，在 gradle.properties 写 deps.<版本>.mc_depends
def minecraftRange = (project.findProperty("deps.${mcVersion}.mc_depends") ?: "~${mcVersionDep}").toString()
// Xaero 的 suggests 精确版本号取坐标里 _Fabric_ 之前的部分；该版本无坐标时标记 __DROP__，产物里整行删除
def xaeroSuggest = { String name ->
	def raw = thirdPartyProp(name)
	return raw == null ? '__DROP__' : raw.split('_Fabric_')[0]
}
def xaeroMinimapSuggest = xaeroSuggest('xaero_minimap')
def xaeroWorldMapSuggest = xaeroSuggest('xaero_world_map')

processResources {
	inputs.property "version", project.version
	// 这些值必须进输入指纹，否则改完 deps 后 processResources 会被误判为 UP-TO-DATE
	inputs.property "minecraftRange", minecraftRange
	inputs.property "fabricloaderVersion", loaderDep
	inputs.property "javaVersion", javaDep
	inputs.property "xaeroMinimapSuggest", xaeroMinimapSuggest
	inputs.property "xaeroWorldMapSuggest", xaeroWorldMapSuggest

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version,
			"minecraft_range": minecraftRange,
			"fabricloader_version": loaderDep,
			"java_version": javaDep,
			"xaero_minimap": xaeroMinimapSuggest,
			"xaero_world_map": xaeroWorldMapSuggest
	}

	doLast {
		// 该版本查不到 Xaero 坐标时占位符是 __DROP__：整行删掉，而不是留一个错的精确版本号
		// 输出目录从 outputs 里取（ProcessResources 没有可直接访问的 destinationDirectory 属性）
		def destDir = outputs.files.files.find { it.isDirectory() }
		def metaFile = destDir == null ? null : new File(destDir, 'fabric.mod.json')
		if (metaFile != null && metaFile.exists() && metaFile.getText("UTF-8").contains('__DROP__')) {
			def kept = metaFile.getText("UTF-8").readLines().findAll { !it.contains('__DROP__') }
			metaFile.setText(kept.join(System.lineSeparator()) + System.lineSeparator(), "UTF-8")
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = Integer.parseInt(javaDep)
}

test {
	useJUnitPlatform()
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.toVersion(javaDep)
	targetCompatibility = JavaVersion.toVersion(javaDep)
}

jar {
	// 许可证文件后缀只跟随模组名，避免产物命名规则变化时改动 JAR 内部结构
	inputs.property "archivesName", project.archives_base_name

	// LICENSE 位于仓库根目录：版本节点子项目在 versions/<v>/ 下，必须显式指向根项目
	from(rootProject.file("LICENSE")) {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
	
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

sourcesJar {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
